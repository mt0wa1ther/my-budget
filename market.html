<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#005bff">
<title>Маркет — миллионы товаров с доставкой</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#0f1720;--muted:#6b7480;--line:#e6e9ee;--blue:#005bff;--blue-dark:#0047c7;--red:#f91155;--green:#0f9d58;--radius:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
button,input,select{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;padding:0 16px 70px}
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);margin:0 -16px 18px;padding:10px 16px}
.header-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.search{flex:1;display:flex;gap:8px;min-width:200px}
.search input{flex:1;min-height:44px;border:1.5px solid var(--blue);border-radius:10px;padding:0 14px;font-size:14px;outline:none}
.search button{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:0 20px;font-weight:700;cursor:pointer}
.icon-btn{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:0 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.icon-btn:hover{border-color:var(--blue);color:var(--blue)}
.badge{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:700}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.cats button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:9px 15px;font-size:13px;cursor:pointer;white-space:nowrap}
.cats button.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.banner{background:linear-gradient(100deg,#005bff,#7b2ff7);border-radius:16px;color:#fff;padding:26px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.banner h2{font-size:clamp(20px,3vw,28px);line-height:1.2}
.banner p{margin:6px 0 0;opacity:.85;font-size:13.5px}
.banner .btn{background:#fff;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.product{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.product:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,23,32,.10)}
.art{position:relative;aspect-ratio:1;display:grid;place-items:center;color:#fff;font-size:44px}
.discount{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px}
.fav{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.9);border:0;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--muted)}
.fav.active{color:var(--red)}
.body{padding:13px;display:flex;flex-direction:column;gap:5px;flex:1}
.price{font-size:17px;font-weight:800}
.price small{color:var(--muted);font-weight:400;font-size:12px;text-decoration:line-through;margin-left:6px}
.title{font-size:13.5px;font-weight:500;line-height:1.35}
.rating{color:var(--muted);font-size:11.5px}
.rating b{color:#f5a623}
.delivery{color:var(--green);font-size:11.5px;font-weight:600;margin-top:auto}
.modal{position:fixed;inset:0;background:rgba(15,23,32,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:60}
.modal.show{display:flex}
.sheet{width:min(780px,100%);background:#fff;border-radius:16px;overflow:hidden;position:relative;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sheet-grid{display:grid;grid-template-columns:320px 1fr}
.sheet-art{aspect-ratio:1;display:grid;place-items:center;font-size:70px}
.sheet-body{padding:24px}
.sheet-body h2{font-size:22px;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.big-price{font-size:28px;font-weight:800;margin:8px 0}
.big-price small{color:var(--muted);font-weight:400;font-size:14px;text-decoration:line-through;margin-left:8px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.spec div{background:var(--bg);border-radius:8px;padding:9px 11px;font-size:12.5px}
.spec span{color:var(--muted);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.close{position:absolute;top:14px;right:14px;border:0;background:rgba(0,0,0,.4);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;box-shadow:-20px 0 60px rgba(15,23,32,.2);transform:translateX(105%);transition:transform .3s;z-index:70;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-head{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-body{flex:1;overflow:auto;padding:14px 18px}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-item .mini{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.cart-item b{display:block;font-size:13px}
.cart-item span{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{border:1px solid var(--line);background:#fff;width:26px;height:26px;border-radius:7px;cursor:pointer}
.drawer-foot{padding:18px;border-top:1px solid var(--line)}
.total-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.total-row.grand{font-size:18px;font-weight:800;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;transition:.15s;width:100%}
.btn:hover{background:var(--blue-dark)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.small{width:auto;padding:8px 13px;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,150%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:100;transition:transform .3s}
.toast.show{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);padding:40px;border:1px dashed var(--line);border-radius:var(--radius);font-size:13px}
@media(max-width:760px){.sheet-grid{grid-template-columns:1fr}.sheet-art{aspect-ratio:16/10;font-size:52px}.header-inner{flex-wrap:wrap}.search{order:3;width:100%}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.banner{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="header-inner"><div class="logo"><i>M</i> Маркет</div><div class="search"><input id="search" placeholder="Искать товары, бренды и категории..."><button id="searchBtn">Найти</button></div><button class="icon-btn" id="favOpen">★<span class="badge" id="favCount">0</span></button><button class="icon-btn" id="cartOpen">Корзина<span class="badge" id="cartCount">0</span></button></div></div>
<div class="cats" id="cats"></div>
<div class="banner"><div><h2>Скидки до 50% на электронику</h2><p>Тысячи товаров с быстрой доставкой и честными отзывами</p></div><button class="btn small" onclick="setCategory('Электроника')">Смотреть</button></div>
<div class="grid" id="grid"></div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet" style="position:relative"></div></div>
<div class="drawer" id="cartDrawer"><div class="drawer-head"><h2 style="font-size:18px">Корзина</h2><button class="btn small ghost" onclick="closeCart()">Закрыть</button></div><div class="drawer-body" id="cartBody"></div><div class="drawer-foot" id="cartFoot"></div></div>
<div class="drawer" id="favDrawer"><div class="drawer-head"><h2 style="font-size:18px">Избранное</h2><button class="btn small ghost" onclick="closeFav()">Закрыть</button></div><div class="drawer-body" id="favBody"></div></div>
<div class="toast" id="toast">Готово</div>
<script>
"use strict";
function byId(id){return document.getElementById(id)}
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function toast(t){var e=byId("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},1500)}
function money(v){return (Number(v)||0).toLocaleString("ru-RU")+" ₽"}
var products=[{id:"1",title:"Смартфон Nova X5 256GB",cat:"Электроника",price:29990,old:39990,icon:"📱",color:"#1d3557",rating:4.8,reviews:1243,delivery:"Завтра",seller:"TechStore"},{id:"2",title:"Наушники SoundPro ANC",cat:"Электроника",price:4990,old:8990,icon:"🎧",color:"#5a3a7a",rating:4.7,reviews:864,delivery:"Завтра",seller:"AudioHouse"},{id:"3",title:"Кроссовки Urban Run",cat:"Одежда",price:3990,old:6990,icon:"👟",color:"#2f6b4f",rating:4.6,reviews:512,delivery:"2–3 дня",seller:"SportLine"},{id:"4",title:"Куртка Winter Shell",cat:"Одежда",price:6490,old:9990,icon:"🧥",color:"#37474f",rating:4.5,reviews:321,delivery:"2–4 дня",seller:"UrbanWear"},{id:"5",title:"Робот-пылесос CleanBot",cat:"Дом",price:14990,old:21990,icon:"🤖",color:"#455a64",rating:4.7,reviews:976,delivery:"Завтра",seller:"HomeTech"},{id:"6",title:"Набор кастрюль Chef 5 предметов",cat:"Дом",price:5990,old:8990,icon:"🍳",color:"#8a5a2b",rating:4.8,reviews:431,delivery:"2–3 дня",seller:"KitchenPro"},{id:"7",title:"Парфюм Amber Night 50ml",cat:"Красота",price:3490,old:5490,icon:"🧴",color:"#7a2f4f",rating:4.9,reviews:1502,delivery:"Завтра",seller:"BeautyRoom"},{id:"8",title:"Набор для ухода Skin Ritual",cat:"Красота",price:2290,old:3490,icon:"💧",color:"#3a7a6b",rating:4.6,reviews:689,delivery:"2–3 дня",seller:"SkinLab"},{id:"9",title:"Гантели 2×10 кг",cat:"Спорт",price:4990,old:7490,icon:"🏋️",color:"#37474f",rating:4.7,reviews:298,delivery:"3–5 дней",seller:"IronGear"},{id:"10",title:"Коврик для йоги Pro",cat:"Спорт",price:1790,old:2990,icon:"🧘",color:"#5a7a3a",rating:4.8,reviews:754,delivery:"Завтра",seller:"ZenFit"},{id:"11",title:"Игровая мышь Phantom RGB",cat:"Электроника",price:2490,old:3990,icon:"🖱️",color:"#2b2b45",rating:4.6,reviews:1102,delivery:"Завтра",seller:"GameZone"},{id:"12",title:"Часы Pulse Fit 2",cat:"Электроника",price:3990,old:6990,icon:"⌚",color:"#1f3a5f",rating:4.5,reviews:2033,delivery:"Завтра",seller:"TechStore"}];
var categories=["Все","Электроника","Одежда","Дом","Красота","Спорт"];
var cart=[],favorites=[],category="Все",query="";
function renderCats(){var box=byId("cats");box.innerHTML="";categories.forEach(function(name){var b=document.createElement("button");b.textContent=name;b.className=name===category?"active":"";b.addEventListener("click",function(){setCategory(name)});box.appendChild(b)})}
function setCategory(name){category=name;renderCats();renderGrid()}
function discountPercent(item){if(!item.old)return 0;return Math.round((1-item.price/item.old)*100)}
function renderGrid(){var box=byId("grid");box.innerHTML="";var items=products.filter(function(item){var mc=category==="Все"||item.cat===category;var text=(item.title+" "+item.cat+" "+item.seller).toLowerCase();var mq=!query||text.indexOf(query)>=0;return mc&&mq});if(!items.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">Ничего не найдено</div>';return}items.forEach(function(item){var el=document.createElement("div");el.className="product";var isFav=favorites.some(function(r){return r.id===item.id});el.innerHTML='<div class="art" style="background:'+item.color+'">'+(discountPercent(item)?'<span class="discount">-'+discountPercent(item)+'%</span>':'')+'<button class="fav'+(isFav?" active":"")+'">★</button>'+esc(item.icon)+'</div><div class="body"><div class="price">'+money(item.price)+(item.old?'<small>'+money(item.old)+'</small>':'')+'</div><div class="title">'+esc(item.title)+'</div><div class="rating"><b>★ '+item.rating+'</b> · '+item.reviews+' отзывов</div><div class="delivery">Доставка: '+esc(item.delivery)+'</div></div>';el.querySelector(".fav").addEventListener("click",function(e){e.stopPropagation();toggleFav(item)});el.addEventListener("click",function(){openProduct(item)});box.appendChild(el)})}
function toggleFav(item){var i=favorites.findIndex(function(r){return r.id===item.id});if(i>=0){favorites.splice(i,1);toast("Удалено из избранного")}else{favorites.push(item);toast("Добавлено в избранное")}byId("favCount").textContent=favorites.length;renderGrid();renderFav()}
function openProduct(item){var sheet=byId("sheet");sheet.innerHTML='<button class="close" onclick="closeModal()">✕</button><div class="sheet-grid"><div class="sheet-art" style="background:'+item.color+'">'+esc(item.icon)+'</div><div class="sheet-body"><h2>'+esc(item.title)+'</h2><div class="sub">'+esc(item.cat)+' · '+esc(item.seller)+' · ★ '+item.rating+' ('+item.reviews+')</div><div class="big-price">'+money(item.price)+(item.old?'<small>'+money(item.old)+'</small>':'')+'</div><div class="spec"><div><span>Доставка</span>'+esc(item.delivery)+'</div><div><span>Продавец</span>'+esc(item.seller)+'</div><div><span>Гарантия</span>12 месяцев</div><div><span>Возврат</span>14 дней</div></div><button class="btn" onclick=\'addToCart("'+item.id+'")\'>Добавить в корзину</button></div></div>';byId("modal").classList.add("show")}
function closeModal(){byId("modal").classList.remove("show")}
byId("modal").addEventListener("click",function(e){if(e.target===byId("modal"))closeModal()});
function addToCart(id){var item=products.find(function(r){return r.id===id});if(!item)return;var found=cart.find(function(r){return r.id===id});if(found)found.qty++;else cart.push({id:item.id,title:item.title,price:item.price,icon:item.icon,color:item.color,qty:1});renderCart();closeModal();toast("Добавлено в корзину")}
function changeQty(id,d){var item=cart.find(function(r){return r.id===id});if(!item)return;item.qty+=d;if(item.qty<=0)cart=cart.filter(function(r){return r.id!==id});renderCart()}
function renderCart(){byId("cartCount").textContent=cart.reduce(function(s,i){return s+i.qty},0);var body=byId("cartBody"),foot=byId("cartFoot");if(!cart.length){body.innerHTML='<div class="empty">Корзина пуста</div>';foot.innerHTML='<button class="btn ghost" disabled style="opacity:.5">Оформить заказ</button>';return}body.innerHTML=cart.map(function(item){return '<div class="cart-item"><div class="mini" style="background:'+item.color+'">'+esc(item.icon)+'</div><div style="flex:1"><b>'+esc(item.title)+'</b><span>'+money(item.price)+'</span><div class="qty"><button onclick=\'changeQty("'+item.id+'",-1)\'>−</button><span>'+item.qty+'</span><button onclick=\'changeQty("'+item.id+'",1)\'>+</button></div></div><div style="font-weight:700;white-space:nowrap">'+money(item.price*item.qty)+'</div></div>'}).join("");var total=cart.reduce(function(s,i){return s+i.price*i.qty},0);var delivery=total>5000?0:299;foot.innerHTML='<div class="total-row"><span>Товары</span><span>'+money(total)+'</span></div><div class="total-row"><span>Доставка</span><span>'+(delivery?money(delivery):"Бесплатно")+'</span></div><div class="total-row grand"><span>Итого</span><span>'+money(total+delivery)+'</span></div><button class="btn" style="margin-top:12px" onclick="checkout()">Оформить заказ</button>'}
function checkout(){cart=[];renderCart();closeCart();toast("Заказ оформлен")}
function renderFav(){var body=byId("favBody");if(!favorites.length){body.innerHTML='<div class="empty">В избранном пока ничего нет</div>';return}body.innerHTML=favorites.map(function(item){return '<div class="cart-item"><div class="mini" style="background:'+item.color+'">'+esc(item.icon)+'</div><div style="flex:1"><b>'+esc(item.title)+'</b><span>'+money(item.price)+'</span></div><button class="btn small ghost" onclick=\'toggleFavById("'+item.id+'")\'>Убрать</button></div>'}).join("")}
function toggleFavById(id){var item=favorites.find(function(r){return r.id===id});if(item)toggleFav(item)}
function openCart(){byId("cartDrawer").classList.add("show")}
function closeCart(){byId("cartDrawer").classList.remove("show")}
function openFav(){byId("favDrawer").classList.add("show")}
function closeFav(){byId("favDrawer").classList.remove("show")}
byId("cartOpen").addEventListener("click",openCart);
byId("favOpen").addEventListener("click",openFav);
byId("searchBtn").addEventListener("click",function(){query=byId("search").value.trim().toLowerCase();renderGrid()});
byId("search").addEventListener("keydown",function(e){if(e.key==="Enter"){query=this.value.trim().toLowerCase();renderGrid()}});
renderCats();renderGrid();renderCart();renderFav();
</script>
</body>
</html>
