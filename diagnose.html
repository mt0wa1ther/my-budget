:disabled{opacity:.5}</style></head><body><h1>Диагностика загрузки</h1><p>Эта страница не изменяет бюджет, не подключается к комнате и не отправляет данные сторонним сервисам. Исходный HTML загружается только с вашего сайта. Значения из хранилища не выводятся.</p><button id="start">1. Проверить HTML</button><button id="preview" disabled>2. Показать без JavaScript</button><button id="storage">Размер локальных данных</button><pre id="log">Диагностическая страница появилась. Нажмите «Проверить HTML».</pre><div id="frame"></div><script>
(function(){
'use strict';var source='',log=document.getElementById('log'),busy=false;
function out(s){log.textContent+='\n'+s;}
window.addEventListener('error',function(e){out('Ошибка диагностики: '+e.message);});
document.getElementById('start').onclick=async function(){
 if(busy)return;busy=true;this.disabled=true;log.textContent='Начинаем запрос index.html…';
 var t=performance.now(),c=typeof AbortController!=='undefined'?new AbortController():null;
 var timeout=setTimeout(function(){out('Прошло 15 секунд без завершения запроса.');if(c)c.abort();},15000);
 try{
  var url=new URL('index.html',location.href);url.searchParams.set('diag',String(Date.now()));
  var r=await fetch(url.href,{cache:'no-store',signal:c?c.signal:undefined});
  out('Заголовки: '+Math.round(performance.now()-t)+' мс; HTTP '+r.status);
  if(!r.ok)throw new Error('HTTP '+r.status);
  source=await r.text();out('HTML полностью: '+Math.round(performance.now()-t)+' мс');
  out('Размер после декодирования: '+new Blob([source]).size+' байт');
  out('Content-Encoding: '+(r.headers.get('content-encoding')||'не указан'));
  var doc=new DOMParser().parseFromString(source,'text/html'),external=Array.from(doc.querySelectorAll('script[src],link[rel="stylesheet"]'));
  out('Kaspersky в HTML: '+(/kaspersky-labs\.com/i.test(source)?'ДА':'нет'));
  out('Внешние JS/CSS-подключения: '+external.length);
  external.forEach(function(el){var u=new URL(el.getAttribute('src')||el.getAttribute('href'),location.href);out('  '+el.tagName+' '+u.origin+u.pathname);});
  out('Встроенных скриптов: '+doc.querySelectorAll('script:not([src])').length);
  document.getElementById('preview').disabled=false;out('Теперь нажмите «Показать без JavaScript».');
 }catch(e){out('Запрос не завершён: '+e.message);}finally{clearTimeout(timeout);busy=false;document.getElementById('start').disabled=false;}
};
document.getElementById('preview').onclick=function(){
 if(!source)return;
 var doc=new DOMParser().parseFromString(source,'text/html');
 doc.querySelectorAll('script,link,iframe,object,embed,meta[http-equiv="refresh"]').forEach(function(el){el.remove();});
 var f=document.createElement('iframe');f.setAttribute('sandbox','');f.title='Интерфейс без выполнения JavaScript';
 var t=performance.now();f.onload=function(){out('Предпросмотр загружен за '+Math.round(performance.now()-t)+' мс. Это время события load, не замер первого отображения.');};
 document.getElementById('frame').replaceChildren(f);
 var csp=doc.createElement('meta');csp.httpEquiv='Content-Security-Policy';csp.content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src 'none'";doc.head.prepend(csp);
 f.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
 out('Создан статический предпросмотр. Кнопки в нём намеренно не работают.');
};
document.getElementById('storage').onclick=function(){
 var t=performance.now();out('Читаем только размер основного локального состояния…');
 try{var value=localStorage.getItem('uzat_budget_main');out('Основное состояние: '+(value===null?'отсутствует':value.length+' символов')+'; чтение '+Math.round(performance.now()-t)+' мс');}catch(e){out('Хранилище: '+e.message);}
};
})();
