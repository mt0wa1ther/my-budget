<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #f6f7fb; color: #17181c; padding: 20px;
    }
    .card {
      width: 100%; max-width: 400px; background: #fff; padding: 28px;
      border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; color: #666; }
    input, button {
      width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; box-sizing: border-box;
    }
    input { border: 1px solid #ddd; margin-bottom: 12px; }
    button { border: 0; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .error { color: #dc2626; min-height: 20px; margin-bottom: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Вход по коду</h1>
    <p>Введите код доступа.</p>

    <form id="form">
      <input id="code" type="password" autocomplete="off" placeholder="Код доступа" required>
      <div id="error" class="error" role="alert"></div>
      <button id="btn" type="submit">Войти</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('form');
    const code = document.getElementById('code');
    const error = document.getElementById('error');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      error.textContent = '';
      btn.disabled = true;

      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code.value })
        });

        const data = await r.json();

        if (!r.ok || !data.ok) {
          error.textContent = data.error === 'too_many_attempts'
            ? 'Слишком много попыток. Попробуйте позже.'
            : 'Неверный код доступа.';
          return;
        }

        location.replace('/');
      } catch {
        error.textContent = 'Ошибка соединения.';
      } finally {
        btn.disabled = false;
      }
    });

    code.focus();
  </script>
</body>
</html>
